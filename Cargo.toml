[package]
name = "tvmatch"
version = "0.1.0"
edition = "2024"
description = "Bounded subtitle-evidence identification for television files"
publish = false

[workspace]
members = [".", "crates/media-mkv-webm", "crates/media-isobmff"]
default-members = ["."]
resolver = "3"

[features]
default = ["ocr", "opensubtitles"]
media = ["dep:media-mkv-webm", "dep:media-isobmff"]
ocr = ["media", "dep:ocrs", "dep:rten", "dep:rten-imageproc"]
opensubtitles = ["dep:ureq", "dep:serde", "dep:serde_json", "dep:sha2"]

[dependencies]
media-mkv-webm = { path = "crates/media-mkv-webm", optional = true, default-features = false }
media-isobmff = { path = "crates/media-isobmff", optional = true, default-features = false }

ocrs = { version = "=0.13.0", optional = true, default-features = false, features = ["rten"] }
rten = { version = "=0.26.0", optional = true, default-features = false, features = ["rten_format"] }

rten-imageproc = { version = "=0.26.0", optional = true }

ureq = { version = "=3.3.0", optional = true, default-features = false, features = ["rustls"] }
serde = { version = "=1.0.228", optional = true, features = ["derive"] }
serde_json = { version = "=1.0.149", optional = true }
sha2 = { version = "=0.10.9", optional = true }

[profile.release]
strip = true
lto = true
codegen-units = 1
